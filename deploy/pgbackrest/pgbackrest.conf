[global]
repo1-type=sftp
repo1-path=/home/pgbackrest/trading-hub
repo1-sftp-host=u630285-sub4.your-storagebox.de
repo1-sftp-host-port=23
repo1-sftp-host-user=u630285-sub4
repo1-sftp-private-key-file=/run/trading-pgbackrest/storagebox.key
repo1-sftp-host-key-check-type=strict
repo1-sftp-host-key-hash-type=sha256
repo1-sftp-known-host=/run/trading-pgbackrest/storagebox.known_hosts
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-retention-archive=2
repo1-retention-archive-type=full
expire-auto=n
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=off
lock-path=/run/pgbackrest
spool-path=/run/pgbackrest

[trading-hub]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
