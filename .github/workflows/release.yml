name: Trading Hub immutable image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-hub-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Require deliberate main candidate
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: test "$RELEASE_REF" = refs/heads/main && test "$RELEASE_EVENT" = workflow_dispatch
      - name: Verify private owning repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_REPOSITORY" = kernscale/Kernscale-Trading
          test "$(gh api repos/kernscale/Kernscale-Trading --jq '.private == true and (.full_name | ascii_downcase) == "kernscale/kernscale-trading"')" = true
          printf 'privateRepository=true\n'
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record build timestamp
        id: identity
        shell: bash
        run: printf 'created=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to private GHCR package
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            SOURCE_REF=${{ github.ref_name }}
            SOURCE_CREATED=${{ steps.identity.outputs.created }}
            SOURCE_VERSION=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Kernscale Trading Hub
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.identity.outputs.created }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          tags: ghcr.io/kernscale/kernscale-trading:sha-${{ github.sha }}
          cache-from: type=gha,scope=kernscale-trading
          cache-to: type=gha,mode=max,scope=kernscale-trading
      - name: Verify private package and actual immutable image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_CREATED: ${{ steps.identity.outputs.created }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          install -d -m 700 release
          gh api orgs/kernscale/packages/container/kernscale-trading \
            --jq '{name, visibility, repository: (if .repository == null then null else (.repository.full_name // "") end)}' > release/package-access.json
          jq -e '.name == "kernscale-trading" and .visibility == "private" and
            (.repository == null or ((.repository | type) == "string" and (.repository | ascii_downcase) == "kernscale/kernscale-trading"))' \
            release/package-access.json > /dev/null
          IMAGE_REF="ghcr.io/kernscale/kernscale-trading@${IMAGE_DIGEST}"
          docker pull --platform linux/amd64 "$IMAGE_REF"
          docker image inspect "$IMAGE_REF" \
            --format '{"RepoDigests":{{json .RepoDigests}},"Architecture":{{json .Architecture}},"Os":{{json .Os}},"Config":{"User":{{json .Config.User}},"Labels":{{json .Config.Labels}}}}' \
            > release/image-inspection.json
          python3 -B deploy/verify_image.py release/package-access.json release/image-inspection.json \
            "$IMAGE_REF" "$SOURCE_COMMIT" "$SOURCE_CREATED" > release/image-verification.json
          cat release/image-verification.json
      - name: Record immutable image evidence
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_CREATED: ${{ steps.identity.outputs.created }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          install -d -m 700 release
          jq -n --arg image "ghcr.io/kernscale/kernscale-trading@${IMAGE_DIGEST}" \
            --arg commit "$SOURCE_COMMIT" --arg repository "$SOURCE_REPOSITORY" \
            --arg ref "$SOURCE_REF" --arg created "$SOURCE_CREATED" \
            '{schemaVersion: 1, image: $image, sourceCommit: $commit, platform: "linux/amd64",
              labels: {"org.opencontainers.image.revision": $commit, "org.opencontainers.image.source": $repository,
                "org.opencontainers.image.ref.name": $ref, "org.opencontainers.image.created": $created,
                "org.opencontainers.image.version": ("sha-" + $commit)},
              provenanceArtifact: "trading-image-provenance.json", runtimeAccepted: false}' \
            > release/trading-image-release.json
          jq -e . <<<"$BUILD_METADATA" > release/buildx-metadata.json
          jq -e '."buildx.build.provenance" | select(type == "object" and .buildType == "https://mobyproject.org/buildkit@v1")' \
            release/buildx-metadata.json > release/trading-image-provenance.json
          sha256sum release/*.json > release/checksums.sha256
          cat release/trading-image-release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable image evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trading-image-release
          path: release/
          if-no-files-found: error
          retention-days: 90

  runtime:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to private GHCR package
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot disposable immutable image with native PostgreSQL and Redis
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 -B deploy/smoke.py
      - name: Preserve sanitized CI runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trading-ci-runtime
          path: ${{ runner.temp }}/kth-ci-${{ github.run_id }}-${{ github.run_attempt }}-receipt/
          if-no-files-found: error
          retention-days: 30
