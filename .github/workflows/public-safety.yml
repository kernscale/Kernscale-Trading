name: Public repository safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep local operational state out of the public tree
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          blocked = []
          for name in filter(None, paths):
              path = pathlib.PurePosixPath(name)
              environment = path.name == '.env' or (
                  path.name.startswith('.env.') and path.name not in {'.env.example', '.env.sample', '.env.template'}
              )
              if '.orchestration' in path.parts or environment:
                  blocked.append(name)
          if blocked:
              print('Remove local state from the public Git tree:', *blocked, sep='\n')
              sys.exit(1)
          print('Public-tree check passed; credential detection is handled separately by secret scanning.')
          PY
