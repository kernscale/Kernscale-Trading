name: Trading Hub Linux isolation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'kernscale/Kernscale-Trading' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify disposable Linux identities and process fencing
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest bridge.tests.test_linux_qualification -v
          stat --format='%n uid=%u mode=%a' / /opt /var/lib /usr/local/lib /sys/fs/cgroup
          python3 -m pip install --quiet --no-input --target "$RUNNER_TEMP/trading-isolation-deps" 'httpx==0.28.1' 'pydantic==2.14.3'
          sudo -n env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
            PYTHONPATH="$RUNNER_TEMP/trading-isolation-deps" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" RUNNER_ENVIRONMENT="${{ runner.environment }}" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /usr/bin/python3 -B bridge/tests/qualify_linux.py --expected-sha "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/trading-linux-isolation.json"
      - name: Preserve sanitized qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trading-linux-isolation
          path: ${{ runner.temp }}/trading-linux-isolation.json
          if-no-files-found: error
          retention-days: 30
