name: Trading Hub source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_DB: trading_test
          POSTGRES_USER: trading_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U trading_test -d trading_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: trading_test
      DB_USERNAME: trading_test
      DB_PASSWORD: synthetic-ci-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pcntl, pdo_sqlite, pdo_pgsql, redis, zip
          tools: composer:v2
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          npm ci --ignore-scripts
      - name: Prepare isolated test application
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          php artisan package:discover --ansi
          php artisan key:generate --force --no-interaction
          php artisan wayfinder:generate --with-form --no-interaction
      - name: Check affected frontend types
        run: npm run types:check
      - name: Check session read cursor regression
        run: node --test tests/Frontend/session-read.test.mjs
      - name: Prepare native PDF extraction
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftotext -v
      - name: Check explicit candidate feature selection
        run: |
          php artisan test --compact \
            tests/Feature/Auth/AuthenticationTest.php tests/Feature/Auth/RegistrationTest.php \
            tests/Feature/Auth/InvitationTest.php tests/Feature/Auth/MembershipTest.php \
            tests/Feature/Auth/OperationalSecurityTest.php tests/Feature/Auth/TwoFactorChallengeTest.php \
            tests/Feature/Auth/MemberManagementTest.php \
            tests/Feature/Settings/ProfileUpdateTest.php tests/Feature/Settings/SecurityTest.php \
            tests/Feature/Settings/AvatarTest.php \
            tests/Feature/DashboardTest.php tests/Feature/ResearchLifecycleTest.php \
            tests/Feature/ResearchDispatchStateTest.php tests/Feature/ResearchSessionManagementTest.php \
            tests/Feature/ResearchDeletionTest.php \
            tests/Feature/ResearchActivityTest.php tests/Feature/ResearchArtifactsTest.php tests/Feature/ResearchAttachmentsTest.php \
            tests/Feature/ResearchClarificationsTest.php \
            tests/Feature/DerivedOutputsTest.php \
            tests/Feature/WorkspaceProposalsTest.php tests/Feature/PublicationTest.php \
            tests/Feature/OutputHistoryTest.php tests/Feature/CommunityOutputLinksTest.php \
            tests/Feature/PortfolioToolsTest.php tests/Feature/ValuationHistoryTest.php \
            tests/Feature/SnapshotSyncTest.php tests/Feature/LegacyTradingImportTest.php \
            tests/Feature/NativeTradingSourceTest.php tests/Feature/NativeSourceSyncTest.php \
            tests/Feature/ReadinessTest.php tests/Feature/ProxyBoundaryTest.php \
            tests/Feature/CapitalioPreviewTest.php
      - name: Check runtime source contract
        run: |
          python3 -B deploy/tests/test_runtime.py
          python3 -B deploy/tests/test_image.py
          python3 -B deploy/tests/test_smoke.py
      - name: Preserve complete selected Capitalio reference
        run: python3 -B tests/Design/test_capitalio_reference.py
      - name: Check pinned research streaming and session protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/omp-sdk-tests"
          python3 - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.load(open('bridge/pyproject.toml', 'rb'))['project']
          requirements = project['dependencies'] + project['optional-dependencies']['test']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'omp-sdk-tests', 'requirements.txt').write_text('\n'.join(requirements) + '\n')
          PY
          "$RUNNER_TEMP/omp-sdk-tests/bin/pip" install --quiet --no-input -r "$RUNNER_TEMP/omp-sdk-tests/requirements.txt"
          "$RUNNER_TEMP/omp-sdk-tests/bin/python" -c 'from importlib.metadata import version; print({name: version(name) for name in ("omp-rpc", "fastapi", "httpx", "starlette", "pydantic")})'
          "$RUNNER_TEMP/omp-sdk-tests/bin/python" -B -m unittest \
            bridge.tests.test_research_metrics bridge.tests.test_omp_stream bridge.tests.test_session_paths \
            bridge.tests.test_portfolio bridge.tests.test_bridge bridge.tests.test_attachment_tools \
            bridge.tests.test_http_contract bridge.tests.test_clarifications bridge.tests.test_clarification_channel \
            bridge.tests.test_host_lifecycle -v
